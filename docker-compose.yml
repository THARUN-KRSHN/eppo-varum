services:
  backend:
    build: ./backend
    environment:
      TRANSITLENS_DATABASE_PATH: data/transitlens.sqlite3
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes: ["backend_data:/app/data"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  backend_data:
