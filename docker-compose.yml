services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: transitlens
      POSTGRES_USER: transitlens
      POSTGRES_PASSWORD: transitlens
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://transitlens:transitlens@db:5432/transitlens
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
